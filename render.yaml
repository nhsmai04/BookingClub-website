# render.yaml - Render Deployment Configuration for BookingClub
# MongoDB Atlas is configured via MONGO_URI secret
# Do NOT commit actual secrets - set them in Render Dashboard

services:
  - type: web
    name: bookingclub-backend
    env: docker
    dockerfilePath: ./be/Dockerfile
    dockerContext: ./be
    envVars:
      - key: NODE_ENV
        value: production

      # MongoDB Atlas Connection String (set in Render Secrets)
      - key: MONGO_URI
        fromSecret: MONGO_URI

      - key: PORT
        value: 5002
      - key: DB_NAME
        value: BookingClub

      # JWT Secrets (set in Render Secrets)
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromSecret: JWT_REFRESH_SECRET

      # Other configuration
      - key: JWT_EXPIRE
        value: 7d
      - key: REFRESH_TOKEN_EXPIRE
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://bookingclub-frontend.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: FRONTEND_URL
        value: https://bookingclub-frontend.onrender.com

    startCommand: npm start
    plan: standard
    healthCheckPath: /api/v1/health
    region: singapore

  - type: web
    name: bookingclub-frontend
    env: docker
    dockerfilePath: ./fe/Dockerfile
    dockerContext: ./fe
    envVars:
      - key: VITE_BACKEND_URL
        value: https://bookingclub-backend.onrender.com
    startCommand: nginx -g "daemon off;"
    plan: standard
    region: singapore
